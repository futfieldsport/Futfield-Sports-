<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('futfield_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <title>Futfield | Live Football Scores, Fan Community &amp; Futfield Tube</title>
    <meta
      name="description"
      content="Join worldwide football fans on FUTFIELD! Watch match highlights, join live stadium rooms, and connect with football fans worldwide."
    />
    <meta
      name="keywords"
      content="football app, live scores, football social, soccer chat, match highlights, futfield tube, quick kicks, fanzone"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Futfield" />
    <meta name="theme-color" content="#00E676" />
    <link rel="canonical" href="https://www.futfieldsport.com.ng/" />

    <!-- Open Graph / WhatsApp Social Sharing Card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FUTFIELD" />
    <meta property="og:title" content="FUTFIELD — Join me on FUTFIELD!" />
    <meta
      property="og:description"
      content="Watch match highlights, join live stadium rooms, and connect with football fans worldwide."
    />
    <meta property="og:url" content="https://www.futfieldsport.com.ng/" />
    <meta property="og:image" content="https://www.futfieldsport.com.ng/futfield-logo.jpg" />
    <meta property="og:image:secure_url" content="https://www.futfieldsport.com.ng/futfield-logo.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="FUTFIELD - Stadium Green Football Logo" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@futfieldsport" />
    <meta name="twitter:title" content="FUTFIELD — Join me on FUTFIELD!" />
    <meta
      name="twitter:description"
      content="Watch match highlights, join live stadium rooms, and connect with football fans worldwide."
    />
    <meta name="twitter:image" content="https://www.futfieldsport.com.ng/futfield-logo.jpg" />
    <meta name="twitter:image:alt" content="FUTFIELD football stadium banner and logo" />

    <link rel="icon" type="image/jpeg" href="/futfield-logo.jpg" />
    <link rel="apple-touch-icon" href="/futfield-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Organization & WebSite JSON-LD Structured Data -->
    <script type="application/ld+json" id="futfield-org-schema">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Futfield",
        "alternateName": "FUTFIELD",
        "url": "https://www.futfieldsport.com.ng",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.futfieldsport.com.ng/futfield-logo.jpg"
        },
        "email": "futfieldsport@gmail.com",
        "sameAs": [
          "https://x.com/futfieldsport",
          "https://www.instagram.com/futfieldsport",
          "https://www.facebook.com/futfieldsport"
        ]
      }
    </script>
    <script type="application/ld+json" id="futfield-website-schema">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Futfield",
        "url": "https://www.futfieldsport.com.ng",
        "description": "Join worldwide football fans on FUTFIELD! Watch match highlights, join live stadium rooms, and connect with football fans worldwide.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.futfieldsport.com.ng/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#090D12] text-slate-900 dark:text-[#F1F5F9] antialiased selection:bg-[#00E676] selection:text-black min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
